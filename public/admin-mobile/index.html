<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Origin Admin Mobile</title>
  <meta name="theme-color" content="#0d1624">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="../images/Icon.png">
  <link rel="apple-touch-icon" href="../images/Icon.png">
  <style>
    :root {
      --bg: #050910;
      --panel: #0d1624;
      --card: #102034;
      --border: #233449;
      --text: #e6ebf5;
      --muted: #9fb0c7;
      --accent: #38f2c7;
      --accent-2: #6dd3ff;
      --ok: #34d399;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(56,242,199,.12), transparent 34%),
        radial-gradient(circle at 85% 10%, rgba(109,211,255,.1), transparent 30%),
        var(--bg);
      padding-bottom: 76px;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 1rem .85rem;
      display: grid;
      gap: .75rem;
    }
    .hero, .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: .85rem;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: .6rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .hero h1 { margin: .15rem 0 .35rem 0; font-size: 1.35rem; }
    .muted { color: var(--muted); }
    .status {
      margin-top: .45rem;
      font-size: .9rem;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      border: 1px solid var(--border);
      background: #0a1321;
      color: var(--text);
      border-radius: 10px;
      padding: .55rem .8rem;
      text-decoration: none;
      font-weight: 800;
      font-size: .9rem;
      cursor: pointer;
    }
    .btn.primary {
      background: linear-gradient(120deg, var(--accent), #34d399);
      border: none;
      color: #0b1525;
    }
    .btn-row { display: flex; gap: .45rem; flex-wrap: wrap; }
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .55rem;
    }
    .module {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      padding: .7rem;
      display: grid;
      gap: .45rem;
    }
    .module-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .module-name { font-weight: 900; letter-spacing: .01em; }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .1rem .5rem;
      font-size: .8rem;
      color: var(--muted);
      background: rgba(10, 19, 33, .8);
    }
    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      z-index: 10;
    }
    .tabs a {
      background: #0a1321;
      color: var(--muted);
      text-decoration: none;
      text-align: center;
      padding: .58rem .2rem calc(.58rem + env(safe-area-inset-bottom));
      font-size: .74rem;
      font-weight: 700;
    }
    .tabs a.active { color: var(--text); background: #102034; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div class="muted">Brighton Admin</div>
        <div class="btn-row">
          <button class="btn primary" id="installBtn" type="button" style="display:none;">Install App</button>
          <a class="btn" href="../admin/login.php">Login</a>
        </div>
      </div>
      <h1>Admin Mobile PWA</h1>
      <div class="muted">Mobile-first admin launcher for content pages. Use Manage/Add to jump straight into each admin tool.</div>
      <div id="healthStatus" class="status">Loading database status...</div>
    </section>

    <section class="card">
      <div class="btn-row">
        <a class="btn primary" href="../admin/index.php">Open Admin Home</a>
        <a class="btn" href="../index.html">Main Site</a>
      </div>
    </section>

    <section class="card">
      <div class="muted" style="margin-bottom:.5rem;">Modules</div>
      <div class="quick-grid" id="moduleGrid"></div>
    </section>
  </main>

  <nav class="tabs">
    <a class="active" href="./index.html">Admin</a>
    <a href="../admin/index.php">Desktop</a>
    <a href="../mobile/index.html">GM Mobile</a>
    <a href="../index.html">Site</a>
  </nav>

  <script src="../runtime-config.js"></script>
  <script>
    (function registerAdminSw() {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((err) => {
          console.warn("Admin mobile service worker registration failed", err);
        });
      });
    })();

    const API_BASE = String(window.BRIGHTON_API_BASE || "").trim();
    const apiUrl = (p) => {
      if (!API_BASE) return "../" + p;
      try { return new URL(p, API_BASE).toString(); } catch { return "../" + p; }
    };

    const MODULES = [
      { key: "admin_users", label: "Admins", manage: "../admin/admin-users.php", add: "../admin/admin-users.php" },
      { key: "items", label: "Items", manage: "../admin/items.php", add: "../admin/items.php?action=edit" },
      { key: "powers", label: "Powers", manage: "../admin/powers.php", add: "../admin/powers.php?action=edit" },
      { key: "rpg_factions", label: "RPG Factions", manage: "../admin/rpg-factions.php", add: "../admin/rpg-factions.php?action=edit" },
      { key: "rules_sections", label: "Rules", manage: "../admin/rules.php", add: "../admin/rules.php?action=edit" },
      { key: "gm_lore", label: "GM Lore", manage: "../admin/gm-lore.php", add: "../admin/gm-lore.php?action=edit" },
      { key: "enemies", label: "Enemies", manage: "../admin/enemies.php", add: "../admin/enemies.php?action=edit" },
      { key: "wargame_factions", label: "Wargame Factions", manage: "../admin/wargame-factions.php", add: "../admin/wargame-factions.php?action=edit" },
      { key: "wargame_units", label: "Wargame Units", manage: "../admin/wargame-units.php", add: "../admin/wargame-units.php?action=edit" }
    ];

    function buildModules(counts) {
      const grid = document.getElementById("moduleGrid");
      grid.innerHTML = "";
      MODULES.forEach((m) => {
        const count = counts && Object.prototype.hasOwnProperty.call(counts, m.key) ? counts[m.key] : "?";
        const card = document.createElement("article");
        card.className = "module";
        card.innerHTML = `
          <div class="module-head">
            <div class="module-name">${m.label}</div>
            <div class="pill">${count} rows</div>
          </div>
          <div class="btn-row">
            <a class="btn" href="${m.manage}">Manage</a>
            <a class="btn primary" href="${m.add}">Add New</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadHealth() {
      const status = document.getElementById("healthStatus");
      try {
        const res = await fetch(apiUrl("api/health.php"), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data || !data.ok) throw new Error("Invalid health payload");
        buildModules(data.counts || {});
        status.textContent = "Database online. Counts loaded.";
        status.classList.add("ok");
        return;
      } catch (err) {
        buildModules(null);
        status.textContent = "Could not load database counts. You can still open admin pages.";
        status.classList.add("warn");
      }
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-flex";
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    loadHealth();
  </script>
  <script src="../theme-mode.js"></script>
</body>
</html>
