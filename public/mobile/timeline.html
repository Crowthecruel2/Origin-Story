<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GM Timeline Mobile</title>
  <meta name="theme-color" content="#0d1624">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../images/Icon.png">
  <link rel="apple-touch-icon" href="../images/Icon.png">
  <style>
    :root { --bg:#050910; --panel:#0d1624; --border:#233449; --text:#e6ebf5; --muted:#9fb0c7; --accent:#38f2c7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI,system-ui,sans-serif; color:var(--text); background:var(--bg); padding-bottom:102px; }
    .wrap { max-width:760px; margin:0 auto; padding:1rem; display:grid; gap:.75rem; }
    .detail { position:sticky; top:0; z-index:4; border:1px solid var(--border); background:var(--panel); border-radius:12px; padding:.8rem; display:grid; gap:.3rem; }
    .detail h2 { margin:0; font-size:1.05rem; }
    .date { color:var(--muted); font-size:.9rem; font-weight:700; }
    .content { white-space:pre-wrap; line-height:1.45; max-height:30vh; overflow:auto; }
    .line { position:fixed; left:50%; transform:translateX(-50%); top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--accent),#6dd3ff); opacity:.4; pointer-events:none; z-index:0; }
    .year { position:relative; z-index:1; display:grid; gap:.45rem; margin:.4rem 0 1rem; }
    .year-label { justify-self:center; border:1px solid var(--border); background:#0d1c2f; color:#9fd7ff; border-radius:999px; padding:.2rem .7rem; font-weight:800; font-size:.9rem; }
    .nodes { display:grid; gap:.5rem; }
    .node { border:1px solid var(--border); border-radius:10px; background:#102034; opacity:.58; padding:.62rem; text-align:left; color:inherit; }
    .node.active { opacity:1; border-color:var(--accent); }
    .node .title { font-weight:800; line-height:1.25; }
    .node .date { color:#9fd7ff; }
    .tabs { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border); z-index:6; }
    .tabs a { background:#0a1321; color:var(--muted); text-decoration:none; text-align:center; padding:.58rem .2rem calc(.58rem + env(safe-area-inset-bottom)); font-size:.74rem; font-weight:700; }
    .tabs a.active { color:var(--text); background:#102034; }
  </style>
</head>
<body>
  <div class="line" aria-hidden="true"></div>
  <main class="wrap">
    <section id="detail" class="detail"></section>
    <section id="timeline"></section>
  </main>
  <nav class="tabs">
    <a href="./index.html">Home</a>
    <a class="active" href="./timeline.html">Timeline</a>
    <a href="./enemies.html">Enemies</a>
    <a href="./character-builder.html">Builder</a>
    <a href="./rules.html">Rules</a>
    <a href="./wargame.html">Wargame</a>
  </nav>
  <script src="../runtime-config.js"></script>
  <script src="../pwa-register.js"></script>
  <script>
    const API_BASE = String(window.BRIGHTON_API_BASE || "").trim();
    const apiUrl = (p) => { if (!API_BASE) return "../" + p; try { return new URL(p, API_BASE).toString(); } catch { return "../" + p; } };
    const detail = document.getElementById("detail");
    const timeline = document.getElementById("timeline");
    const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(typeof txt==="string")n.textContent=txt; return n; };
    const yr = (d) => (String(d||"").match(/^(\d{4})/)||[])[1] || "Unknown";
    const fmt = (d) => d ? String(d).slice(0,10) : "No date";
    const isHex = (v) => /^#[0-9A-Fa-f]{6}$/.test(String(v||""));
    function show(item) {
      detail.innerHTML = "";
      const h = el("h2","",item.title||"Untitled");
      const dt = el("div","date",fmt(item.event_date));
      const ct = el("div","content",item.content||"");
      detail.append(h,dt,ct);
    }
    async function load() {
      const res = await fetch(apiUrl("api/gm-lore.php"), { cache:"no-store" });
      const data = await res.json();
      const rows = Array.isArray(data.sections) ? data.sections : [];
      if (!rows.length) { detail.textContent = "No timeline data."; return; }
      const sorted = [...rows].sort((a,b)=>(yr(a.event_date)+"").localeCompare(yr(b.event_date)+"") || Number(a.sort_order||0)-Number(b.sort_order||0));
      const groups = new Map();
      for (const r of sorted) { const y = yr(r.event_date); if (!groups.has(y)) groups.set(y,[]); groups.get(y).push(r); }
      const btns = [];
      let first = true;
      for (const [year, list] of groups) {
        const block = el("section","year");
        block.appendChild(el("div","year-label",year));
        const nodes = el("div","nodes");
        list.forEach((r) => {
          const b = el("button","node");
          b.type = "button";
          const d = el("div","date",fmt(r.event_date));
          const t = el("div","title",r.title||r.slug||"Untitled");
          if (r.is_era && isHex(r.era_bg_color)) b.style.backgroundColor = r.era_bg_color;
          if (r.is_era && isHex(r.era_text_color)) { b.style.color = r.era_text_color; d.style.color = r.era_text_color; }
          if (r.is_era) t.style.fontSize = "1.14rem";
          b.append(d,t);
          b.addEventListener("click", ()=>{ btns.forEach(x=>x.classList.remove("active")); b.classList.add("active"); show(r); });
          if (first) { b.classList.add("active"); show(r); first = false; }
          btns.push(b);
          nodes.appendChild(b);
        });
        block.appendChild(nodes);
        timeline.appendChild(block);
      }
    }
    load().catch((e) => { detail.textContent = "Failed to load timeline: " + e; });
  </script>
  <script src="../theme-mode.js"></script>
</body>
</html>
