<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GM Enemies Mobile</title>
  <meta name="theme-color" content="#0d1624">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../images/Icon.png">
  <link rel="apple-touch-icon" href="../images/Icon.png">
  <style>
    :root { --bg:#050910; --panel:#0d1624; --border:#233449; --text:#e6ebf5; --muted:#9fb0c7; --accent:#38f2c7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI,system-ui,sans-serif; color:var(--text); background:var(--bg); padding-bottom:95px; }
    .wrap { max-width:760px; margin:0 auto; padding:1rem; display:grid; gap:.7rem; }
    .search { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:12px; padding:.7rem .8rem; width:100%; }
    .card { border:1px solid var(--border); border-radius:12px; background:var(--panel); padding:.75rem; display:grid; gap:.45rem; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem; }
    .name { font-weight:800; }
    .muted { color:var(--muted); font-size:.9rem; }
    .stats { display:flex; flex-wrap:wrap; gap:.35rem; }
    .pill { border:1px solid var(--border); border-radius:999px; padding:.18rem .5rem; font-size:.82rem; color:var(--muted); }
    details > summary { cursor:pointer; font-weight:700; color:var(--accent); }
    pre { margin:0; white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; background:#0a1321; border:1px solid var(--border); border-radius:10px; padding:.6rem; }
    .tabs { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border); }
    .tabs a { background:#0a1321; color:var(--muted); text-decoration:none; text-align:center; padding:.58rem .2rem calc(.58rem + env(safe-area-inset-bottom)); font-size:.74rem; font-weight:700; }
    .tabs a.active { color:var(--text); background:#102034; }
  </style>
</head>
<body>
  <main class="wrap">
    <input id="q" class="search" placeholder="Search enemy name/id..." autocomplete="off">
    <section id="list"></section>
  </main>
  <nav class="tabs">
    <a href="./index.html">Home</a>
    <a href="./timeline.html">Timeline</a>
    <a class="active" href="./enemies.html">Enemies</a>
    <a href="./character-builder.html">Builder</a>
    <a href="./rules.html">Rules</a>
    <a href="./wargame.html">Wargame</a>
  </nav>
  <script src="../runtime-config.js"></script>
  <script src="../pwa-register.js"></script>
  <script>
    const API_BASE = String(window.BRIGHTON_API_BASE || "").trim();
    const apiUrl = (p) => { if (!API_BASE) return "../" + p; try { return new URL(p, API_BASE).toString(); } catch { return "../" + p; } };
    const list = document.getElementById("list");
    const q = document.getElementById("q");
    let rows = [];
    const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(typeof txt==="string")n.textContent=txt; return n; };
    const sval = (v) => (Number.isFinite(Number(v)) ? String(v) : "-");
    function render() {
      const term = String(q.value || "").trim().toLowerCase();
      list.innerHTML = "";
      const filtered = !term ? rows : rows.filter(r => String(r.name||"").toLowerCase().includes(term) || String(r.id||"").toLowerCase().includes(term));
      if (!filtered.length) { list.appendChild(el("div","muted","No enemies found.")); return; }
      filtered.forEach((e) => {
        const c = el("article","card");
        const h = el("div","head");
        const left = el("div","");
        left.appendChild(el("div","name",e.name || e.id || "Unnamed"));
        left.appendChild(el("div","muted",[e.class_name,e.origin].filter(Boolean).join(" | ")));
        h.appendChild(left);
        c.appendChild(h);
        const s = el("div","stats");
        [["Lvl",e.level],["HP",e.health],["Energy",e.energy],["Move",e.move_stat],["Armor",e.armor],["Dex",e.dexterity],["Str",e.strength],["Smarts",e.smarts],["Social",e.social],["Durability",e.durability],["Size",e.size]]
          .forEach(([k,v]) => s.appendChild(el("span","pill",k + ": " + sval(v))));
        c.appendChild(s);
        const d = document.createElement("details");
        d.innerHTML = "<summary>Powers / Notes</summary>";
        const box = document.createElement("pre");
        box.textContent = (e.powers_text || "No powers text.") + (e.notes ? "\n\nNotes:\n" + e.notes : "");
        d.appendChild(box);
        c.appendChild(d);
        list.appendChild(c);
      });
    }
    async function load() {
      const res = await fetch(apiUrl("api/enemies.php"), { cache:"no-store" });
      const data = await res.json();
      rows = Array.isArray(data.enemies) ? data.enemies : [];
      render();
    }
    q.addEventListener("input", render);
    load().catch((e) => { list.innerHTML = ""; list.appendChild(el("div","muted","Failed to load enemies: " + e)); });
  </script>
  <script src="../theme-mode.js"></script>
</body>
</html>
